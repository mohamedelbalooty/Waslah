# Waslah local data services (spec X-00, data-model.md §1)
# Lifecycle: pnpm db:up (start+wait healthy) / pnpm db:reset (down -v + up)
name: waslah

services:
  postgres:
    image: postgres:16-alpine
    container_name: waslah-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waslah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waslah}
      POSTGRES_DB: ${POSTGRES_DB:-waslah}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: waslah-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
